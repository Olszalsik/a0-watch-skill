# Settings UI schema for the watch-skill plugin
# Renders as a card under Agent Zero Settings → Plugins → watch-skill.

title: Watch Skill
description: Configure the watch-skill MCP video intelligence layer.
help: https://github.com/oxbshw/watch-skill

groups:
  - id: install
    title: Installation
    description: How the plugin should (or should not) install the watch-skill Python CLI on first enable.
    fields:
      - id: install.auto_install
        type: boolean
        label: Auto-install CLI on enable
        default: false
        help: If true, the plugin will run `uv tool install ...` automatically. If false, it will print a one-liner instead.
      - id: install.prefer_uv
        type: boolean
        label: Prefer `uv`
        default: true
      - id: install.fallback_pipx
        type: boolean
        label: Fall back to `pipx`
        default: true
      - id: install.fallback_pip
        type: boolean
        label: Fall back to `pip`
        default: true

  - id: vision
    title: Vision provider
    description: Pick the model used for visual Q&A, scene descriptions, and the loop critic. Transcription, OCR, and search work without one.
    fields:
      - id: vision.provider
        type: select
        label: Provider
        options: [auto, anthropic, openai, gemini, openrouter, ollama, none]
        default: auto
      - id: vision.model
        type: string
        label: Single model override (optional)
        placeholder: claude-opus-4-5, gpt-4o, gemini-2.0-flash, …
        default: ""
      - id: vision.cheap_model
        type: string
        label: Cheap model (bulk perception, optional)
        default: ""
      - id: vision.strong_model
        type: string
        label: Strong model (final verification, optional)
        default: ""
      - id: vision.env_var_passthrough
        type: boolean
        label: Pass through env-var API keys (recommended)
        default: true
        help: When true, the plugin forwards ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY / OPENROUTER_API_KEY to the MCP server.

  - id: index
    title: Index & storage
    fields:
      - id: index.storage_dir
        type: path
        label: Storage directory
        default: "~/.watch-skill"
        help: Where watched videos, frames, transcriptions, and lessons live. Mount this back to the host in Docker.
      - id: index.auto_mount_in_docker
        type: boolean
        label: Auto-print docker --volume mount hint
        default: true
      - id: index.library_chunk_k_videos
        type: integer
        label: Default k_videos for library_synthesize
        default: 5

  - id: mcp
    title: MCP server
    fields:
      - id: mcp.expose_tools_in_prompt
        type: boolean
        label: Inject 23 MCP tools into the system prompt
        default: true
      - id: mcp.tool_blacklist
        type: list
        item_type: string
        label: Tool blacklist (MCP names to hide)
        default: []
      - id: mcp.spawn_timeout_s
        type: integer
        label: Spawn timeout (seconds)
        default: 30

  - id: loop
    title: THE LOOP
    description: Defaults for the browser/screen/game/video-gen verification loops.
    fields:
      - id: loop.default_max_iterations
        type: integer
        label: Max iterations per loop
        default: 5
      - id: loop.default_duration
        type: number
        label: Default recording length (seconds)
        default: 8.0
      - id: loop.record_proof
        type: boolean
        label: Render before/after proof (MP4 + GIF) on pass
        default: true
      - id: loop.proof_format
        type: list
        item_type: string
        label: Proof formats
        default: ["mp4", "gif"]

  - id: cost
    title: Cost policy
    fields:
      - id: cost.policy
        type: select
        label: Policy
        options: [auto, cheapest, quality_first, offline_only]
        default: auto
      - id: cost.token_budget_per_call
        type: integer
        label: Token budget per call (0 = unlimited)
        default: 0
      - id: cost.semantic_cache
        type: boolean
        label: Semantic answer cache
        default: true

  - id: ui
    title: WebUI
    fields:
      - id: ui.show_status_chip
        type: boolean
        label: Show "🎬 watch-skill ready" chip in topbar
        default: true
      - id: ui.show_help_button
        type: boolean
        label: Add a small help button next to the chip
        default: true
