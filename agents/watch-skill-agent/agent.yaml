# watch-skill sub-agent definition (v1.1.0 re-port).
#
# The framework's SubAgent model (helpers/subagents.py SubAgentListItem)
# parses ONLY these keys: name, title, description, context, enabled, avatar
# (+ prompts, which are the *.md files in this profile's prompts/ dir).
# The v1.0.0 keys — profile, inherits, prompt_include, tools, model,
# tool_data_modifications, a0_skills, workdir, help — were silently ignored
# by pydantic and are gone. To override model/tools for this profile, add a
# settings.json next to this file (loaded by
# extensions/python/agent_init/_15_load_profile_settings.py).
#
# The persona is injected by extensions/python/system_prompt/
# _10_watch_skill_persona.py (appends prompts/watch-skill-agent.md when
# agent.config.profile == "watch-skill-agent"); the plugin's ws_* tool
# prompts live in the plugin root prompts/ dir and are picked up
# automatically by _11_tools_prompt.py.
name: watch-skill-agent
title: Watch-Skill Video Analyst
description: |
  Specialized sub-agent that wraps the watch-skill MCP layer (23 tools) and
  a focused video-intelligence system prompt. Use it for any task that
  requires understanding video — watching links, asking follow-ups with
  timestamp evidence, running THE LOOP for visual verification, or building
  a searchable video library. Local-first: transcription, OCR, and search
  need no API key; heavy visual Q&A routes to the configured vision provider.
context: |
  Delegate here for anything video: watching URLs or local recordings,
  timestamped Q&A, cross-video search and synthesis, and the
  capture → critique → fix → proof verification loop. The agent watches a
  video once, indexes it, then answers follow-ups from the index with
  timestamp citations.
enabled: true