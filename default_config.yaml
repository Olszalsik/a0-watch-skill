# Default configuration for the watch_skill plugin
# Override values in Agent Zero Settings -> Plugins -> watch_skill.
#
# Every key below has a live consumer in tools/, api/, hooks.py or the
# banners extension. Keys with no consumer were removed rather than left
# as decoration: a settings toggle that silently does nothing is worse
# than no toggle, because it reads as "configured".

install:
  # Run the CLI installer from the install hook. Off by default: it is a
  # network install of a third-party package, so it is opt-in.
  auto_install: false
  # pip extras to install. [standard] is REQUIRED since engine 1.4.0 --
  # a bare install has no frame extraction, no retrieval and no MCP server,
  # and every `watch` then fails with perceive.missing_dependency.
  # [all] is not a declared extra; [transcribe] and [vlm] never were.
  install_extras: "[standard]"

vision:
  # Applied to the CLI subprocess env as WATCHSKILL_VISION_PROVIDER /
  # WATCHSKILL_VISION_MODEL (see _common.apply_vision_env).
  # auto | anthropic | openai | gemini | openrouter | ollama | none
  provider: auto
  # Optional single-model override; empty lets the engine route by tier.
  model: ""
  # Name of the env var holding the provider key, for the settings UI to
  # report whether a key is present. Never the key value itself.
  api_key_env: "WATCHSKILL_ANTHROPIC_API_KEY"

index:
  # How many videos `library ask` consults. Passed to the engine as
  # `library ask --videos N` (the engine flag and this key differ by name).
  library_chunk_k_videos: 5

loop:
  default_max_iterations: 5
  default_duration: 8.0

ui:
  show_status_chip: true       # show the watch-skill status chip in the WebUI topbar
  show_help_button: true       # include the help button in the chip
